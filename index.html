<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔱MAG🔥</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .active-view { display: flex; }
        
        .btn-mag { background-color: #ff4500; color: white; border: none; padding: 25px 45px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5); }
        
        .squares-container { display: flex; justify-content: center; gap: 8px; margin-top: 20px; width: 100%; padding: 0 10px; }
        .square { width: 100px; height: 100px; background-color: #1e1e1e; border: 2px solid #ff4500; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-align: center; padding: 5px; }

        .grid-9-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .grid-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .small-square {
            width: 80px;
            height: 80px;
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 26px;
            text-align: center;
            padding: 5px;
        }
        
        /* Painel de Saldo e Resultados */
        .info-panel {
            margin: 8px 0;
            font-size: 14px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* Botão Redondo de Girar (Spin) */
        .spin-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease;
        }
        .spin-btn:active {
            transform: scale(0.9);
        }
        .rotating {
            transform: rotate(360deg);
        }

        .back-btn { margin-top: 10px; background: none; border: 1px solid #ffffff; color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        h2 { margin-bottom: 2px; font-size: 18px; }
        p { color: #aaa; font-size: 12px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Tela 1: Inicial -->
    <div class="container active-view" id="homeView">
        <button class="btn-mag" onclick="showView('catalogView')">🔱MAG🔥</button>
    </div>

    <!-- Tela 2: Menu com os 3 Provedores -->
    <div class="container" id="catalogView">
        <h2>Escolha um Provedor</h2>
        <div class="squares-container">
            <div class="square" onclick="showView('provAView')">Provedor A</div>
            <div class="square" onclick="showView('provBView')">Provedor B</div>
            <div class="square" onclick="showView('provCView')">Provedor C</div>
        </div>
        <button class="back-btn" onclick="showView('homeView')">Voltar</button>
    </div>

    <!-- Tela Estrutura Provedor A (Com Regras de Linha e Multiplicador) -->
    <div class="container" id="provAView">
        <h2>Provedor A</h2>
        <p>Linhas premiadas & Tela Cheia (10x)</p>
        
        <div class="info-panel" id="resultadoTexto">Gire para jogar!</div>

        <div class="grid-9-container">
            <div class="grid-row">
                <div class="small-square" id="sq1">💎</div>
                <div class="small-square" id="sq2">🔥</div>
                <div class="small-square" id="sq3">777</div>
            </div>
            <div class="grid-row">
                <div class="small-square" id="sq4">🍋</div>
                <div class="small-square" id="sq5">💎</div>
                <div class="small-square" id="sq6">⭐</div>
            </div>
            <div class="grid-row">
                <div class="small-square" id="sq7">777</div>
                <div class="small-square" id="sq8">🍒</div>
                <div class="small-square" id="sq9">💎</div>
            </div>
        </div>

        <button class="spin-btn" id="spinButton" onclick="girarSlot()">GIRAR</button>
        <button class="back-btn" onclick="showView('catalogView')">← Voltar ao Menu</button>
    </div>

    <!-- Tela Estrutura Provedor B -->
    <div class="container" id="provBView">
        <h2>Painel do Provedor B</h2>
        <p>Aqui fica a estrutura do Provedor B.</p>
        <button class="back-btn" onclick="showView('catalogView')">Voltar</button>
    </div>

    <!-- Tela Estrutura Provedor C -->
    <div class="container" id="provCView">
        <h2>Painel do Provedor C</h2>
        <p>Aqui fica a estrutura do Provedor C.</p>
        <button class="back-btn" onclick="showView('catalogView')">Voltar</button>
    </div>

    <script>
        function showView(viewId) {
            const views = document.querySelectorAll('.container');
            views.forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        function girarSlot() {
            const btn = document.getElementById('spinButton');
            btn.classList.add('rotating');

            const opcoes = ['💎', '🔥', '777', '🍋', '⭐', '🍒', '💰'];
            let valoresGrid = [];

            // Sorteia os 9 quadrados
            for(let i = 1; i <= 9; i++) {
                const randomIndex = Math.floor(Math.random() * opcoes.length);
                const simbolo = opcoes[randomIndex];
                valoresGrid[i] = simbolo;
                document.getElementById('sq' + i).innerText = simbolo;
            }

            // Validação das Regras de Vitória
            let premioTotal = 0;
            let mensagem = "Não premiado. Tente de novo!";

            // 1. Linha Diagonal Principal (1, 5, 9) - Valor fixo: 10
            if (valoresGrid[1] === valoresGrid[5] && valoresGrid[5] === valoresGrid[9]) {
                premioTotal += 10;
            }

            // 2. Linha Diagonal Secundária (7, 5, 3) - Valor fixo: 15
            if (valoresGrid[7] === valoresGrid[5] && valoresGrid[5] === valoresGrid[3]) {
                premioTotal += 15;
            }

            // 3. Linha Horizontal Central (4, 5, 6) - Valor fixo: 20
            if (valoresGrid[4] === valoresGrid[5] && valoresGrid[5] === valoresGrid[6]) {
                premioTotal += 20;
            }

            // 4. Verificação de Tela Cheia (Todas as 9 posições iguais) -> Multiplicador 10x
            let telaCheia = true;
            for(let i = 2; i <= 9; i++) {
                if(valoresGrid[i] !== valoresGrid[1]) {
                    telaCheia = false;
                    break;
                }
            }

            if (telaCheia) {
                premioTotal = (premioTotal > 0 ? premioTotal : 50) * 10; // Base ou soma multiplicada por 10x
                mensagem = `🔥 TELA CHEIA! 10X! Ganhou ${premioTotal} moedas!`;
            } else if (premioTotal > 0) {
                mensagem = `🎉 Linha Premiada! Ganhou ${premioTotal} moedas!`;
            }

            document.getElementById('resultadoTexto').innerText = mensagem;

            setTimeout(() => {
                btn.classList.remove('rotating');
            }, 400);
        }
    </script>

</body>
  </html>
