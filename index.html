<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔱MAG🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Botão Principal */
        .btn-mag {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 25px 45px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5);
            transition: 0.3s;
        }
        .btn-mag:hover {
            background-color: #ff5722;
            transform: scale(1.03);
        }
        /* Seção dos Quadrados */
        .grid-section {
            display: none;
        }
        .squares-container {
            display: flex;
            justify-content: center;
            gap: 8px; /* Espaço bem pequeno entre eles, quase colados */
            margin-top: 25px;
            width: 100%;
            padding: 0 10px;
        }
        .square {
            width: 100px; /* Tamanho ajustado para caber na tela do celular */
            height: 100px;
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .back-btn {
            margin-top: 35px;
            background: none;
            border: 1px solid #ffffff;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial com o Botão 🔱MAG🔥 -->
    <div class="container" id="homeView">
        <button class="btn-mag" onclick="abrirPagina()">🔱MAG🔥</button>
    </div>

    <!-- Tela com os 3 Quadrados -->
    <div class="container grid-section" id="catalogView">
        <h2>Catálogo de Provedores</h2>
        <div class="squares-container">
            <div class="square">Provedor A</div>
            <div class="square">Provedor B</div>
            <div class="square">Provedor C</div>
        </div>
        <button class="back-btn" onclick="voltarHome()">Voltar</button>
    </div>

    <script>
        function abrirPagina() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('catalogView').style.display = 'flex';
        }

        function voltarHome() {
            document.getElementById('catalogView').style.display = 'none';
            document.getElementById('homeView').style.display = 'flex';
        }
    </script>

</body>
</html>
