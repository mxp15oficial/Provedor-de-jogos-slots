<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔱MAG🔥</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; position: relative; }
        .container { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .active-view { display: flex; }
        
        .btn-mag { background-color: #ff4500; color: white; border: none; padding: 25px 45px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5); }
        
        .squares-container { display: flex; justify-content: center; gap: 8px; margin-top: 20px; width: 100%; padding: 0 10px; }
        .square { width: 100px; height: 100px; background-color: #1e1e1e; border: 2px solid #ff4500; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .square img { width: 100%; height: 100%; object-fit: contain; }

        .grid-9-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }
        .grid-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        
        /* Colunas de caça-níqueis verticais (reels) */
        .slot-reel {
            width: 75px;
            height: 237px; /* 3 itens visíveis: 3 * 75px + 2 * 6px de gap = 237px */
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .reel-track {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
        .reel-item {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 5px;
        }
        .reel-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .dashboard-bar {
            width: 92%;
            max-width: 350px;
            background-color: #1a1a1a;
            border: 2px solid #ff4500;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 8px auto 5px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .dashboard-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .dashboard-box:not(:last-child) {
            border-right: 1px solid #333;
            margin-right: 4px;
            padding-right: 4px;
        }
        .dashboard-icon {
            font-size: 14px;
            margin-bottom: 2px;
        }
        .dashboard-value {
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .spin-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .spin-btn:active { transform: scale(0.9); }

        .turbo-btn, .auto-btn {
            width: 45px;
            height: 45px;
            background: #1a1a1a;
            border: 2px solid #ff4500;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .turbo-btn:active, .auto-btn:active { transform: scale(0.9); }

        .auto-menu {
            position: absolute;
            bottom: 80px;
            background: #1a1a1a;
            border: 2px solid #ff4500;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            z-index: 1000;
        }
        .auto-menu button {
            background: #333;
            color: white;
            border: 1px solid #ff4500;
            padding: 6px 15px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .auto-menu button:hover { background: #ff4500; }

        .floating-lua-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: rgba(30, 30, 30, 0.85);
            border: 2px solid #ff4500;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 999;
            touch-action: none;
        }
        .floating-lua-btn:active { cursor: grabbing; }

        h2 { margin-bottom: 2px; font-size: 18px; }
        p { color: #aaa; font-size: 11px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="floating-lua-btn" id="luaBtn" onclick="showView('catalogView')" title="Voltar ao Menu">🏠</div>

    <div class="container active-view" id="homeView">
        <button class="btn-mag" onclick="showView('catalogView')">🔱MAG🔥</button>
    </div>

    <div class="container" id="catalogView">
        <h2>Escolha um Provedor</h2>
        <div class="squares-container">
            <div class="square" onclick="showView('provAView')"><img src="fdf89154-c901-4fe2-8a5d-03972e219629.png" alt="Provedor A"></div>
            <div class="square" onclick="showView('provBView')">Provedor B</div>
            <div class="square" onclick="showView('provCView')">Provedor C</div>
        </div>
    </div>

    <div class="container" id="provAView">
        <h2>Provedor A</h2>
        <p>Aposta: R$ 0,50 | Tela Cheia = 10x</p>
        
        <!-- Grade baseada em Reels verticais com animação de descida -->
        <div class="grid-9-container">
            <div class="grid-row">
                <div class="slot-reel"><div class="reel-track" id="track0"></div></div>
                <div class="slot-reel"><div class="reel-track" id="track1"></div></div>
                <div class="slot-reel"><div class="reel-track" id="track2"></div></div>
            </div>
        </div>

        <div class="dashboard-bar">
            <div class="dashboard-box">
                <span class="dashboard-icon">💳</span>
                <span class="dashboard-value" id="saldoDisplay">28.77</span>
            </div>
            <div class="dashboard-box">
                <span class="dashboard-icon">💸</span>
                <span class="dashboard-value" id="apostaDisplay">00.50</span>
            </div>
            <div class="dashboard-box">
                <span class="dashboard-icon">🧧</span>
                <span class="dashboard-value" id="ganhoDisplay" style="color: #ffcc00;">0.00</span>
            </div>
        </div>

        <div class="controls-row">
            <button class="turbo-btn" id="turboBtn" onclick="toggleTurbo()" title="Modo Turbo">⚡</button>
            <button class="spin-btn" id="spinButton" onclick="iniciarGiro(false)">GIRAR</button>
            <button class="auto-btn" onclick="toggleAutoMenu()" title="Giro Automático">AUTO</button>
        </div>

        <div class="auto-menu" id="autoMenu">
            <button onclick="selecionarAuto(10)">10 Giros</button>
            <button onclick="selecionarAuto(30)">30 Giros</button>
            <button onclick="selecionarAuto(50)">50 Giros</button>
            <button onclick="selecionarAuto(80)">80 Giros</button>
            <button onclick="selecionarAuto(100)">100 Giros</button>
            <button onclick="selecionarAuto(1000)">1000 Giros</button>
        </div>
    </div>

    <div class="container" id="provBView">
        <h2>Painel do Provedor B</h2>
        <p>Estrutura do Provedor B.</p>
    </div>

    <div class="container" id="provCView">
        <h2>Painel do Provedor C</h2>
        <p>Estrutura do Provedor C.</p>
    </div>

    <script>
        let saldoTotal = 28.77;
        const valorAposta = 0.50;
        
        let turboState = 0; // 0 = Normal, 1 = ⚡, 2 = ⚡⚡
        let girosAutomaticosRestantes = 0;
        let isAutoRunning = false;
        let isSpinning = false;

        const imgNovaTroca = '<img src="14a23979-c5de-4013-be1c-eb7eec8c278c.png" alt="Nova Imagem">';
        const imgNovoFogo = '<img src="1a0fcb85-626b-4e50-a371-32b9c5e2d875.png" alt="Novo Fogo">';
        const imgWildOnda = '<img src="wild_777_onda.gif" alt="Wild Onda">';
        const imgNovo777 = '<img src="341b5a70-6b94-48d4-937b-33edd729029e.png" alt="Novo 777">';
        const imgNovoLimao = '<img src="ffadc725-bc9e-4167-9e02-c03c25c07c42.png" alt="Novo Limao">';
        const imgEstrelaNova = '<img src="97307bb3-9ddd-4862-9c5c-4482bef314d0.png" alt="Estrela Nova">';
        const imgNovaCereja = '<img src="533c8c34-095e-4588-9b1d-c3bf876e5883.png" alt="Nova Cereja">';

        const valoresSimbolos = {
            [imgNovaTroca]: 13.00,
            [imgNovoFogo]: 3.00,
            [imgWildOnda]: 8.00,
            [imgNovo777]: 1.50,
            [imgNovoLimao]: 0.50,
            [imgEstrelaNova]: 0.30,
            [imgNovaCereja]: 0.20
        };

        const opcoes = [
            imgNovaTroca, imgNovoFogo, imgNovo777, imgNovoLimao, imgEstrelaNova, imgNovaCereja,
            imgNovaCereja, imgEstrelaNova, imgNovoLimao, imgNovo777, imgWildOnda
        ];

        // Estado inicial dos 3 reels (cada um com 3 itens visíveis)
        let currentReelSymbols = [
            [imgNovaTroca, imgNovoFogo, imgNovo777],
            [imgWildOnda, imgEstrelaNova, imgNovaCereja],
            [imgNovoLimao, imgNovaTroca, imgNovaCereja]
        ];

        window.onload = function() {
            renderReelsInitial();
        };

        function renderReelsInitial() {
            for(let col = 0; col < 3; col++) {
                const track = document.getElementById('track' + col);
                track.style.transition = 'none';
                track.style.top = '0px';
                track.innerHTML = '';
                // Renderiza os 3 símbolos da coluna
                for(let row = 0; row < 3; row++) {
                    const div = document.createElement('div');
                    div.className = 'reel-item';
                    div.innerHTML = currentReelSymbols[col][row];
                    track.appendChild(div);
                }
            }
        }

        function showView(viewId) {
            pararAutoGiro();
            const views = document.querySelectorAll('.container');
            views.forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            
            const lua = document.getElementById('luaBtn');
            if(viewId === 'homeView') {
                lua.style.display = 'none';
            } else {
                lua.style.display = 'flex';
            }
        }

        function toggleTurbo() {
            turboState = (turboState + 1) % 3;
            const btn = document.getElementById('turboBtn');
            if (turboState === 0) btn.innerText = '⚡';
            else if (turboState === 1) btn.innerText = '⚡';
            else if (turboState === 2) btn.innerText = '⚡⚡';
        }

        function toggleAutoMenu() {
            const menu = document.getElementById('autoMenu');
            menu.style.display = (menu.style.display === 'flex' ? 'none' : 'flex');
        }

        function selecionarAuto(quantidade) {
            toggleAutoMenu();
            girosAutomaticosRestantes = quantidade;
            isAutoRunning = true;
            if (!isSpinning) {
                iniciarGiro(true);
            }
        }

        function pararAutoGiro() {
            girosAutomaticosRestantes = 0;
            isAutoRunning = false;
        }

        function iniciarGiro(isAuto) {
            if (isSpinning) return;
            if (!isAuto) {
                pararAutoGiro();
            }

            if (saldoTotal < valorAposta) {
                alert("Saldo insuficiente!");
                pararAutoGiro();
                return;
            }

            isSpinning = true;
            document.getElementById('ganhoDisplay').innerText = "0.00";
            document.getElementById('ganhoDisplay').style.color = "#ffcc00";

            saldoTotal -= valorAposta;
            document.getElementById('saldoDisplay').innerText = saldoTotal.toFixed(2);

            // Sorteia os novos símbolos finais para cada coluna (topo, meio, fundo)
            let targetSymbols = [];
            for(let col = 0; col < 3; col++) {
                let colResult = [];
                for(let row = 0; row < 3; row++) {
                    const randomIndex = Math.floor(Math.random() * opcoes.length);
                    colResult.push(opcoes[randomIndex]);
                }
                targetSymbols.push(colResult);
            }

            // Velocidade com base no Turbo
            let duration = 600; // Normal
            if (turboState === 1) duration = 250; // Turbo Rápido
            if (turboState === 2) duration = 100; // Mega Rápido

            // Executa a animação de descida para cada uma das 3 colunas com leve atraso em cascata
            let colunasFinalizadas = 0;

            for(let col = 0; col < 3; col++) {
                let track = document.getElementById('track' + col);
                
                // Prepara a track duplicando itens para simular rochagem contínua descendo de cima para baixo
                let htmlContent = '';
                // Itens falsos rodando no topo
                for(let k = 0; k < 6; k++) {
                    const rnd = Math.floor(Math.random() * opcoes.length);
                    htmlContent += `<div class="reel-item">${opcoes[rnd]}</div>`;
                }
                // Adiciona os 3 símbolos finais que vão parar perfeitamente no visor
                htmlContent += `<div class="reel-item">${targetSymbols[col][0]}</div>`;
                htmlContent += `<div class="reel-item">${targetSymbols[col][1]}</div>`;
                htmlContent += `<div class="reel-item">${targetSymbols[col][2]}</div>`;

                track.innerHTML = htmlContent;
                
                // Posiciona a track no topo absoluto (offset negativo para puxar de cima para baixo)
                // Cada item tem 75px. 6 itens extras = -450px de deslocamento inicial
                track.style.transition = 'none';
                track.style.top = '-450px';

                // Força reflow
                track.offsetHeight;

                // Anima descendo até top: 0px
                let delayCascade = col * (turboState === 2 ? 20 : 80);
                setTimeout(() => {
                    track.style.transition = `top ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                    track.style.top = '0px';
                }, delayCascade);

                // Quando terminar a animação da coluna
                setTimeout(() => {
                    // Limpa a track deixando apenas os 3 itens definitivos visíveis na posição 0
                    track.style.transition = 'none';
                    track.style.top = '0px';
                    track.innerHTML = `
                        <div class="reel-item">${targetSymbols[col][0]}</div>
                        <div class="reel-item">${targetSymbols[col][1]}</div>
                        <div class="reel-item">${targetSymbols[col][2]}</div>
                    `;

                    colunasFinalizadas++;
                    if (colunasFinalizadas === 3) {
                        // Salva o estado atual
                        currentReelSymbols = targetSymbols;
                        finalizarJogada(targetSymbols);
                    }
                }, duration + delayCascade + 20);
            }
        }

        function finalizarJogada(targetSymbols) {
            // Mapeia para o formato de array de 1 a 9 para as regras de pagamento existentes
            // Coluna 0: sq1, sq4, sq7
            // Coluna 1: sq2, sq5, sq8
            // Coluna 2: sq3, sq6, sq9
            let valoresGrid = [];
            valoresGrid[1] = targetSymbols[0][0];
            valoresGrid[4] = targetSymbols[0][1];
            valoresGrid[7] = targetSymbols[0][2];

            valoresGrid[2] = targetSymbols[1][0];
            valoresGrid[5] = targetSymbols[1][1];
            valoresGrid[8] = targetSymbols[1][2];

            valoresGrid[3] = targetSymbols[2][0];
            valoresGrid[6] = targetSymbols[2][1];
            valoresGrid[9] = targetSymbols[2][2];

            let premioTotal = 0;

            function checarLinha(p1, p2, p3) {
                let s1 = valoresGrid[p1];
                let s2 = valoresGrid[p2];
                let s3 = valoresGrid[p3];

                let isWild1 = (s1 === imgWildOnda);
                let isWild2 = (s2 === imgWildOnda);
                let isWild3 = (s3 === imgWildOnda);

                let simboloBase = null;

                if (!isWild1) simboloBase = s1;
                else if (!isWild2) simboloBase = s2;
                else if (!isWild3) simboloBase = s3;
                else {
                    return valoresSimbolos[imgWildOnda];
                }

                let match1 = isWild1 || (s1 === simboloBase);
                let match2 = isWild2 || (s2 === simboloBase);
                let match3 = isWild3 || (s3 === simboloBase);

                if (match1 && match2 && match3) {
                    return valoresSimbolos[simboloBase] || 0.00;
                }
                return 0;
            }

            premioTotal += checarLinha(1, 2, 3);
            premioTotal += checarLinha(4, 5, 6);
            premioTotal += checarLinha(7, 8, 9);
            premioTotal += checarLinha(1, 5, 9);
            premioTotal += checarLinha(7, 5, 3);

            let telaCheia = true;
            let primeiroSimboloEfetivo = valoresGrid[1] === imgWildOnda ? null : valoresGrid[1];
            
            for(let i = 2; i <= 9; i++) {
                let atual = valoresGrid[i];
                if (atual !== imgWildOnda) {
                    if (primeiroSimboloEfetivo === null) {
                        primeiroSimboloEfetivo = atual;
                    } else if (atual !== primeiroSimboloEfetivo) {
                        telaCheia = false;
                        break;
                    }
                }
            }

            if (telaCheia) {
                let simboloTela = primeiroSimboloEfetivo || imgWildOnda
