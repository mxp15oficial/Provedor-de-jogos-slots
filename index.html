<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔱MAG🔥</title>
    <style>
        /* ... (mesmo CSS anterior) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-mag { background-color: #ff4500; color: white; border: none; padding: 25px 45px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5); }
        .grid-section, .games-section { display: none; }
        .squares-container { display: flex; justify-content: center; gap: 8px; margin-top: 25px; width: 100%; padding: 0 10px; }
        .square { width: 100px; height: 100px; background-color: #1e1e1e; border: 2px solid #ff4500; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .square:active { transform: scale(0.95); background-color: #333; }
        .back-btn { margin-top: 35px; background: none; border: 1px solid #ffffff; color: white; padding: 10px 25px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Tela 1: Inicial -->
    <div class="container" id="homeView">
        <button class="btn-mag" onclick="showView('catalogView')">🔱MAG🔥</button>
    </div>

    <!-- Tela 2: Provedores -->
    <div class="container grid-section" id="catalogView">
        <h2>Escolha um Provedor</h2>
        <div class="squares-container">
            <div class="square" onclick="showView('gamesView')">Provedor A</div>
            <div class="square" onclick="showView('gamesView')">Provedor B</div>
            <div class="square" onclick="showView('gamesView')">Provedor C</div>
        </div>
        <button class="back-btn" onclick="showView('homeView')">Voltar</button>
    </div>

    <!-- Tela 3: Jogos -->
    <div class="container games-section" id="gamesView">
        <h2>Lista de Jogos</h2>
        <div class="squares-container">
            <div class="square">Jogo 1</div>
            <div class="square">Jogo 2</div>
            <div class="square">Jogo 3</div>
        </div>
        <button class="back-btn" onclick="showView('catalogView')">Voltar</button>
    </div>

    <script>
        function showView(viewId) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('catalogView').style.display = 'none';
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById(viewId).style.display = 'flex';
        }
    </script>

</body>
</html>
