<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔱MAG🔥</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; position: relative; }
        .container { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .active-view { display: flex; }
        
        .btn-mag { background-color: #ff4500; color: white; border: none; padding: 25px 45px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5); }
        
        .squares-container { display: flex; justify-content: center; gap: 8px; margin-top: 20px; width: 100%; padding: 0 10px; }
        .square { width: 100px; height: 100px; background-color: #1e1e1e; border: 2px solid #ff4500; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-align: center; padding: 5px; }

        .grid-9-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }
        .grid-row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .small-square {
            width: 75px;
            height: 75px;
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            padding: 5px;
        }
        
        /* Barra de Ganho Exata na Posição Pedida (Entre a caixa e o botão) */
        .win-display {
            width: 80%;
            height: 32px;
            background-color: #1a1a1a;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto 5px auto;
            font-size: 14px;
            color: #ffcc00;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* Botão Redondo de Girar (Spin) */
        .spin-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease;
            margin-top: 2px;
        }
        .spin-btn:active { transform: scale(0.9); }
        .rotating { transform: rotate(360deg); }

        /* Botão Flutuante Estilo Lua (Atrás/Cantos) */
        .floating-lua-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: rgba(30, 30, 30, 0.85);
            border: 2px solid #ff4500;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 999;
            touch-action: none;
        }
        .floating-lua-btn:active { cursor: grabbing; }

        h2 { margin-bottom: 2px; font-size: 18px; }
        p { color: #aaa; font-size: 11px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Botão Flutuante Lua (Voltar ao Menu) - Fica arrastável nos cantos -->
    <div class="floating-lua-btn" id="luaBtn" onclick="showView('catalogView')" title="Voltar ao Menu">🏠</div>

    <!-- Tela 1: Inicial -->
    <div class="container active-view" id="homeView">
        <button class="btn-mag" onclick="showView('catalogView')">🔱MAG🔥</button>
    </div>

    <!-- Tela 2: Menu com os 3 Provedores -->
    <div class="container" id="catalogView">
        <h2>Escolha um Provedor</h2>
        <div class="squares-container">
            <div class="square" onclick="showView('provAView')">Provedor A</div>
            <div class="square" onclick="showView('provBView')">Provedor B</div>
            <div class="square" onclick="showView('provCView')">Provedor C</div>
        </div>
    </div>

    <!-- Tela Estrutura Provedor A -->
    <div class="container" id="provAView">
        <h2>Provedor A</h2>
        <p>Linha 1 = R$ 13,00 | Tela Cheia = 10x</p>
        
        <div class="grid-9-container">
            <div class="grid-row">
                <div class="small-square" id="sq1">💰</div>
                <div class="small-square" id="sq2">💰</div>
                <div class="small-square" id="sq3">💰</div>
            </div>
            <div class="grid-row">
                <div class="small-square" id="sq4">🍒</div>
                <div class="small-square" id="sq5">🍒</div>
                <div class="small-square" id="sq6">🔥</div>
            </div>
            <div class="grid-row">
                <div class="small-square" id="sq7">777</div>
                <div class="small-square" id="sq8">⭐</div>
                <div class="small-square" id="sq9">⭐</div>
            </div>
        </div>

        <!-- Barra de exibição de ganho exatamente na linha solicitada -->
        <div class="win-display" id="winDisplay">R$ 0,00</div>

        <button class="spin-btn" id="spinButton" onclick="girarSlot()">GIRAR</button>
    </div>

    <!-- Tela Estrutura Provedor B -->
    <div class="container" id="provBView">
        <h2>Painel do Provedor B</h2>
        <p>Estrutura do Provedor B.</p>
    </div>

    <!-- Tela Estrutura Provedor C -->
    <div class="container" id="provCView">
        <h2>Painel do Provedor C</h2>
        <p>Estrutura do Provedor C.</p>
    </div>

    <script>
        function showView(viewId) {
            const views = document.querySelectorAll('.container');
            views.forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            
            // Oculta o botão flutuante na tela inicial
            const lua = document.getElementById('luaBtn');
            if(viewId === 'homeView') {
                lua.style.display = 'none';
            } else {
                lua.style.display = 'flex';
            }
        }

        function girarSlot() {
            const btn = document.getElementById('spinButton');
            btn.classList.add('rotating');

            const opcoes = ['💰', '🔥', '777', '🍋', '⭐', '🍒'];
            let valoresGrid = [];

            for(let i = 1; i <= 9; i++) {
                const randomIndex = Math.floor(Math.random() * opcoes.length);
                const simbolo = opcoes[randomIndex];
                valoresGrid[i] = simbolo;
                document.getElementById('sq' + i).innerText = simbolo;
            }

            let premioTotal = 0;

            // 1. Linha Superior Horizontal (1, 2, 3) - Valor fixo de R$ 13,00
            if (valoresGrid[1] === valoresGrid[2] && valoresGrid[2] === valoresGrid[3]) {
                premioTotal += 13.00;
            }

            // 2. Linha Central Horizontal (4, 5, 6) - Valor fixo de R$ 15,00
            if (valoresGrid[4] === valoresGrid[5] && valoresGrid[5] === valoresGrid[6]) {
                premioTotal += 15.00;
            }

            // 3. Linha Inferior Horizontal (7, 8, 9) - Valor fixo de R$ 10,00
            if (valoresGrid[7] === valoresGrid[8] && valoresGrid[8] === valoresGrid[9]) {
                premioTotal += 10.00;
            }

            // 4. Diagonais
            if (valoresGrid[1] === valoresGrid[5] && valoresGrid[5] === valoresGrid[9]) {
                premioTotal += 12.00;
            }
            if (valoresGrid[7] === valoresGrid[5] && valoresGrid[5] === valoresGrid[3]) {
                premioTotal += 12.00;
            }

            // 5. Tela Cheia (Multiplicador 10x)
            let telaCheia = true;
            for(let i = 2; i <= 9; i++) {
                if(valoresGrid[i] !== valoresGrid[1]) {
                    telaCheia = false;
                    break;
                }
            }

            if (telaCheia) {
                premioTotal = (premioTotal > 0 ? premioTotal : 30.00) * 10;
            }

            // Mostra o valor na barra de ganho solicitada
            const display = document.getElementById('winDisplay');
            if (premioTotal > 0) {
                display.innerText = `R$ ${premioTotal.toFixed(2).replace('.', ',')}`;
                display.style.color = '#00ff66';
            } else {
                display.innerText = "R$ 0,00";
                display.style.color = '#ffcc00';
            }

            setTimeout(() => {
                btn.classList.remove('rotating');
            }, 400);
        }

        // Lógica do botão flutuante estilo "lua" (arrastável livremente na tela)
        const lua = document.getElementById('luaBtn');
        let isDragging = false;
        let startX, startY;

        lua.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX - lua.offsetLeft;
            startY = e.clientY - lua.offsetTop;
            lua.setPointerCapture(e.pointerId);
        });

        lua.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            lua.style.left = (e.clientX - startX) + 'px';
            lua.style.top = (e.clientY - startY) + 'px';
            lua.style.right = 'auto';
        });

        lua.addEventListener('pointerup', (e) => {
            isDragging = false;
            // Gruda automaticamente nas bordas da tela (esquerda ou direita)
            const rect = lua.getBoundingClientRect();
            const middle = window.innerWidth / 2;
            if (rect.left + rect.width / 2 < middle) {
                lua.style.left = '15px';
            } else {
                lua.style.left = (window.innerWidth - rect.width - 15) + 'px';
            }
        });
    </script>

</body>
</html>
