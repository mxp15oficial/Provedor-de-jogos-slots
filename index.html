<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔱MAG🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
        }
        /* Botão Principal */
        .btn-mag {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 25px 45px; /* Ajustado tamanho */
            font-size: 28px; /* Ajustado fonte */
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 69, 0, 0.5);
            transition: 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-mag:hover {
            background-color: #ff5722;
            transform: scale(1.03);
            box-shadow: 0 6px 25px rgba(255, 69, 0, 0.7);
        }
        /* Seção dos Quadrados (inicialmente oculta) */
        .grid-section {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .squares-container {
            display: flex;
            gap: 25px;
            margin-top: 30px;
        }
        .square {
            width: 140px;
            height: 140px;
            background-color: #1e1e1e;
            border: 3px solid #ff4500;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: 0.3s;
        }
        .square:hover {
            border-color: #ff7043;
            transform: translateY(-5px);
        }
        .back-btn {
            margin-top: 40px;
            background: none;
            border: 1px solid #ffffff;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }
        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial com o Botão 🔱MAG🔥 -->
    <div class="container" id="homeView">
        <button class="btn-mag" onclick="abrirPagina()">🔱MAG🔥</button>
    </div>

    <!-- Tela com os 3 Quadrados -->
    <div class="container grid-section" id="catalogView">
        <h2>Catálogo de Provedores</h2>
        <div class="squares-container">
            <div class="square">Provedor A</div>
            <div class="square">Provedor B</div>
            <div class="square">Provedor C</div>
        </div>
        <button class="back-btn" onclick="voltarHome()">Voltar</button>
    </div>

    <script>
        function abrirPagina() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('catalogView').style.display = 'flex';
        }

        function voltarHome() {
            document.getElementById('catalogView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        }
    </script>

</body>
</html>
