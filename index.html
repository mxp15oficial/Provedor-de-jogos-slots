<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAG🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
        }
        /* Botão Principal */
        .btn-mag {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: 0.3s;
        }
        .btn-mag:hover {
            background-color: #ff5722;
            transform: scale(1.05);
        }
        /* Seção dos Quadrados (inicialmente oculta) */
        .grid-section {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .squares-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .square {
            width: 120px;
            height: 120px;
            background-color: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .back-btn {
            margin-top: 30px;
            background: none;
            border: 1px solid #ffffff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial com o Botão MAG🔥 -->
    <div class="container" id="homeView">
        <button class="btn-mag" onclick="abrirPagina()">📛MAG🔥</button>
    </div>

    <!-- Tela com os 3 Quadrados -->
    <div class="container grid-section" id="catalogView">
        <h2>Escolha uma Opção</h2>
        <div class="squares-container">
            <div class="square">Provedor A</div>
            <div class="square">Provedor B</div>
            <div class="square">Provedor C</div>
        </div>
        <button class="back-btn" onclick="voltarHome()">Voltar</button>
    </div>

    <script>
        function abrirPagina() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('catalogView').style.display = 'flex';
        }

        function voltarHome() {
            document.getElementById('catalogView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        }
    </script>

</body>
</html>
